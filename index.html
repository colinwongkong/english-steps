<section class="hero"><div><div class="eyebrow">READ · LISTEN · DISCOVER</div><h1>Small steps.<br><em>Stronger English.</em></h1><p>按 CEFR 欧洲语言共同参考框架分级的英语阅读。选一个适合你的级别，读一篇、听一遍、点词学表达。</p></div><div class="stat"><strong>6 levels</strong><span>从入门到精通</span></div></section>

<footer id="about"><span>English Steps · 分级阅读练习</span><span>级别参照 CEFR；示例短文为原创学习材料。</span></footer></div><div class="toast" id="toast"></div>
<script>
const levels=[['A1','入门','Beginner'],['A2','基础','Elementary'],['B1','中级','Intermediate'],['B2','中高级','Upper intermediate'],['C1','高级','Advanced'],['C2','精通','Proficient']];
const articles=[
{id:'a1-1',level:'A1',topic:'日常生活',icon:'☀️',mins:2,title:'A Walk in the Park',text:'Mia lives near a small park. Every morning, she walks there with her dog, Ben. They see birds in the trees and people on the path. Ben likes to run, but Mia walks slowly. After thirty minutes, they go home. Mia makes tea, and Ben sleeps by the door.',translation:'Mia住在一个小公园附近。每天早上，她和她的狗Ben一起去那里散步。他们看见树上的鸟和路上的行人。Ben喜欢跑步，但Mia走得很慢。三十分钟后，他们回家。Mia泡了茶，Ben则睡在门边。',words:{lives:'居住',near:'在……附近',every:'每一个；每天',morning:'早晨',walks:'散步；走路',birds:'鸟',trees:'树',path:'小路',slowly:'慢慢地',door:'门'}},
{id:'a1-2',level:'A1',topic:'食物',icon:'🥣',mins:2,title:'The Sunday Market',text:'On Sunday, Leo goes to the market with his sister. They buy apples, bread, and cheese. A man sells fresh flowers. Leo chooses three yellow flowers for their mother. His sister carries the food, and Leo carries the flowers. At home, they make lunch together.',translation:'星期天，Leo和姐姐去市场。他们买了苹果、面包和奶酪。一位男子在卖鲜花。Leo为妈妈挑了三朵黄色的花。姐姐拿着食物，Leo拿着鲜花。回到家，他们一起做午餐。',words:{market:'市场',buy:'买',bread:'面包',cheese:'奶酪',sells:'出售',fresh:'新鲜的',chooses:'挑选',carries:'拿；搬运',together:'一起'}},
{id:'a1-3',level:'A1',topic:'自然',icon:'🌧️',mins:2,title:'A Rainy Day',text:'It is raining today. Sam looks out of the window. The street is wet, and the sky is grey. He takes an umbrella and walks to the library. Inside, it is warm and quiet. Sam finds a book about space and reads until the rain stops.',translation:'今天在下雨。Sam望向窗外。街道湿了，天空灰蒙蒙的。他拿起一把雨伞，走去图书馆。里面温暖又安静。Sam找到一本关于太空的书，一直读到雨停。',words:{raining:'下雨',window:'窗户',street:'街道',wet:'湿的',takes:'拿；带上',umbrella:'雨伞',quiet:'安静的',space:'太空',until:'直到'}},
{id:'a1-4',level:'A1',topic:'日常生活',icon:'🚌',mins:2,title:'Nina’s New Bus Route',text:'Nina starts a new job on Monday. She takes the number six bus to work. The bus stops near a bakery, so she buys a warm roll before she goes to the office. The driver smiles and says hello. Nina likes her new trip across town.',translation:'Nina星期一开始一份新工作。她乘6路公交车上班。公交车在一家面包店附近停靠，所以她去办公室前买了一个热面包卷。司机微笑着向她问好。Nina喜欢这段穿过小镇的新旅程。',words:{starts:'开始',takes:'乘坐；带上',bus:'公交车',stops:'停靠；停止',near:'附近',bakery:'面包店',before:'在……之前',driver:'司机',across:'穿过'}},
{id:'a1-5',level:'A1',topic:'动物',icon:'🐱',mins:2,title:'The Cat at the Window',text:'A small cat sits by the window every afternoon. It watches people walk past the house. One day, a girl sees the cat and waves. The cat moves its tail and gives a quiet sound. The girl visits again the next day with a little bowl of water.',translation:'每天下午，一只小猫都坐在窗边。它看着人们从房子旁边走过。一天，一个女孩看见了猫，便向它挥手。猫摇了摇尾巴，轻轻叫了一声。第二天，女孩又来看它，还带了一小碗水。',words:{sits:'坐',window:'窗户',watches:'看着',past:'经过',waves:'挥手',tail:'尾巴',quiet:'轻柔的',visits:'拜访',bowl:'碗'}},
{id:'a1-6',level:'A1',topic:'食物',icon:'🍲',mins:2,title:'Soup for Grandpa',text:'Omar wants to cook lunch for his grandpa. He cuts carrots and potatoes into small pieces. His grandpa washes the vegetables and puts them in a big pot. They add water and wait. Soon, the kitchen smells wonderful. They eat the soup with fresh bread.',translation:'Omar想为爷爷做午餐。他把胡萝卜和土豆切成小块。爷爷洗好蔬菜，把它们放进一个大锅里。他们加水，然后等待。很快，厨房里飘出香味。他们就着新鲜面包喝汤。',words:{wants:'想要',cook:'烹饪',cuts:'切',pieces:'块；片',washes:'清洗',vegetables:'蔬菜',pot:'锅',smells:'闻起来',fresh:'新鲜的'}},
{id:'a1-7',level:'A1',topic:'日常生活',icon:'⏰',mins:1,title:'My Day',subtitle:'我的一天',text:'Hello! My name is Lily. I am eight years old. I get up at seven o’clock. I eat bread and milk for breakfast. I go to school. I like my school. I play with my friend, Tom. I go home at five o’clock. I am happy.',translation:'你好！我叫Lily。我八岁了。我七点起床。早餐我吃面包、喝牛奶。我去上学。我喜欢我的学校。我和朋友Tom一起玩。我五点回家。我很开心。',words:{hello:'你好',name:'名字',years:'岁；年',get:'得到；起床（get up）',seven:'七',bread:'面包',milk:'牛奶',breakfast:'早餐',school:'学校',friend:'朋友',home:'家',happy:'开心的'}},
{id:'a1-8',level:'A1',topic:'动物',icon:'🐈',mins:1,title:'My Pet',subtitle:'我的宠物',text:'I have a pet. It is a cat. Its name is Mimi. It is small and white. Mimi likes fish. It likes to sleep, too. I play with Mimi every day. I love my cat very much.',translation:'我有一只宠物。它是一只猫。它叫Mimi。它又小又白。Mimi喜欢鱼。它也喜欢睡觉。我每天都和Mimi玩。我非常爱我的猫。',words:{pet:'宠物',cat:'猫',name:'名字',small:'小的',white:'白色的',likes:'喜欢',fish:'鱼',sleep:'睡觉',play:'玩',every:'每一个；每天',love:'爱',much:'非常；很多'}},
{id:'a1-9',level:'A1',topic:'食物',icon:'🍕',mins:1,title:'My Favorite Food',subtitle:'我最喜欢的食物',text:'My favorite food is pizza. It is very good. I like cheese on pizza. I eat pizza with my family. My dad likes pizza, too. My mom likes fruit. Pizza makes me happy.',translation:'我最喜欢的食物是披萨。它非常好吃。我喜欢披萨上的奶酪。我和家人一起吃披萨。我爸爸也喜欢披萨。我妈妈喜欢水果。披萨让我开心。',words:{favorite:'最喜欢的',food:'食物',pizza:'披萨',good:'好的；美味的',cheese:'奶酪',family:'家人',dad:'爸爸',mom:'妈妈',fruit:'水果',makes:'使；让',happy:'开心的'}},
{id:'a2-1',level:'A2',topic:'自然',icon:'🐝',mins:3,title:'A City Garden Takes Root',text:'Every Saturday, a group of neighbours meets on an empty piece of land behind their apartment building. They have turned it into a small garden. Some people grow tomatoes, while others plant flowers to attract bees. The garden gives neighbours fresh food, but it also gives them a place to talk and share ideas.',translation:'每个星期六，一群邻居都会在公寓楼后的一块空地上碰面。他们把那里改成了一个小花园。有些人种番茄，另一些人种花来吸引蜜蜂。花园为邻居提供新鲜食物，也为他们创造了聊天和分享想法的地方。',words:{neighbours:'邻居',empty:'空的',land:'土地',turned:'变成；改造',grow:'种植',attract:'吸引',bees:'蜜蜂',fresh:'新鲜的',share:'分享'}},
{id:'a2-2',level:'A2',topic:'科技',icon:'🚲',mins:3,title:'A Better Way to Get Around',text:'Last year, the town added more bicycle lanes near schools and shops. At first, some drivers worried that the changes would make traffic slower. After several months, however, more people began cycling for short trips. Local shop owners say visitors now stop more often, and the streets feel safer for children.',translation:'去年，这座小镇在学校和商店附近增设了自行车道。起初，一些司机担心这些变化会让交通变慢。然而几个月后，越来越多的人开始骑自行车完成短途出行。当地店主说，现在有更多访客会停下来，街道对孩子来说也更安全了。',words:{added:'增加了',lanes:'车道',worried:'担心',changes:'变化',traffic:'交通',cycling:'骑自行车',visitors:'访客',often:'经常',safer:'更安全的'}},
{id:'a2-3',level:'A2',topic:'文化',icon:'📚',mins:3,title:'Stories on the Night Train',text:'When her grandmother was young, she often travelled by train to visit family. The journey took all night, so passengers brought food and told stories. Years later, she still remembers the sound of wheels on the tracks and the warm light in the carriage. She says the trip felt like a small adventure.',translation:'祖母年轻时常乘火车去探望家人。旅程要花一整夜，所以乘客会带上食物、讲故事。多年以后，她仍记得车轮驶过铁轨的声音，以及车厢里温暖的灯光。她说，那趟旅程就像一次小小的冒险。',words:{journey:'旅程',passengers:'乘客',brought:'带来（bring的过去式）',remembers:'记得',wheels:'车轮',tracks:'铁轨',carriage:'车厢',adventure:'冒险'}},
{id:'a2-4',level:'A2',topic:'旅行',icon:'🗺️',mins:3,title:'A Weekend by the Sea',text:'Maya and her cousin take an early train to the coast. They rent two bicycles near the station and ride along the beach. The wind is cool, but the sun is bright. At lunchtime, they find a small café and order fish sandwiches. Before they go home, Maya collects a smooth white stone as a souvenir.',translation:'Maya和表亲乘早班火车去海边。他们在车站附近租了两辆自行车，沿着海滩骑行。风有些凉，但阳光明亮。午餐时，他们找到一家小咖啡馆，点了鱼肉三明治。回家前，Maya捡了一块光滑的白色石头作纪念品。',words:{cousin:'表亲',coast:'海岸',rent:'租用',station:'车站',along:'沿着',bright:'明亮的',lunchtime:'午餐时间',smooth:'光滑的',souvenir:'纪念品'}},
{id:'a2-5',level:'A2',topic:'科技',icon:'📱',mins:3,title:'A Phone-Free Hour',text:'Kai and his friends decide to spend one hour without their phones. At first, they do not know what to do. Then one friend finds a pack of cards in his bag. They play a simple game and laugh when someone makes a silly mistake. After the hour, they agree to meet again next week.',translation:'Kai和朋友们决定有一小时不看手机。起初，他们不知道该做什么。后来，一个朋友在包里找到一副纸牌。他们玩起简单的游戏，有人犯了个傻乎乎的错误时，大家都笑了。一小时后，他们约好下周再见。',words:{decide:'决定',spend:'度过；花费','at first':'起初',pack:'一副；一包',cards:'纸牌',simple:'简单的',laugh:'笑',mistake:'错误',agree:'同意'}},
{id:'a2-6',level:'A2',topic:'文化',icon:'🎶',mins:3,title:'Music in the Old Station',text:'The old railway station is now a place for local artists. On Friday evenings, musicians play in the waiting room. People bring chairs and listen for free. A baker from the next street sells small cakes outside. The station is busy again, but now visitors come to enjoy music instead of catching a train.',translation:'这座旧火车站如今成了当地艺术家的活动场所。每周五晚上，音乐家会在候车室演奏。人们带上椅子免费聆听。隔壁街的面包师在外面卖小蛋糕。车站又热闹起来了，不过现在访客是来欣赏音乐，而不是赶火车。',words:{railway:'铁路',artists:'艺术家',musicians:'音乐家','waiting room':'候车室',free:'免费地',baker:'面包师',busy:'热闹的',visitors:'访客',instead:'代替'}},
{id:'b1-1',level:'B1',topic:'时事',icon:'🏙️',mins:4,title:'Can Cooler Streets Make Cities Healthier?',text:'On hot summer days, the temperature in a city centre can be several degrees higher than in nearby rural areas. Roads and buildings absorb heat during the day and release it slowly at night. In response, some cities are planting trees, painting roofs with lighter colours and creating small parks. These measures can make streets more comfortable, although they require long-term planning and care.',translation:'在炎热的夏日，市中心的温度可能比附近乡村高出几度。道路和建筑白天吸收热量，夜间再慢慢释放。作为应对，一些城市正在种树、把屋顶刷成较浅的颜色，并建造小型公园。这些措施能让街道更舒适，不过需要长期规划和维护。',words:{temperature:'温度',nearby:'附近的',absorb:'吸收',release:'释放',response:'应对',measures:'措施',comfortable:'舒适的',although:'尽管',require:'需要','long-term':'长期的'}},
{id:'b1-2',level:'B1',topic:'文学',icon:'📖',mins:4,title:'The Library of Borrowed Things',text:'When a neighbourhood library began lending tools, kitchen equipment and board games, its shelves filled quickly. The idea was simple: residents could borrow items they only needed occasionally instead of buying them. A year later, the library had helped hundreds of households save money and introduced neighbours who had rarely spoken before.',translation:'当社区图书馆开始出借工具、厨房设备和桌游时，架子很快就摆满了。这个想法很简单：居民可以借用不常用的物品，而不用购买。一年后，这家图书馆帮助数百户家庭省下了钱，也让原本很少交谈的邻居彼此认识。',words:{lending:'出借',equipment:'设备',shelves:'架子',occasionally:'偶尔',instead:'代替',households:'家庭',introduced:'使认识；介绍',rarely:'很少'}},
{id:'b1-3',level:'B1',topic:'科学',icon:'🌙',mins:4,title:'Why We Need Dark Skies',text:'Artificial light helps people travel and work after sunset, but too much of it can affect wildlife and human sleep. Migrating birds may become confused by bright buildings, while some insects gather around lamps instead of feeding. Several towns have responded by dimming unnecessary lights and choosing lamps that point downwards. The changes are modest, yet they can make the night sky easier to see.',translation:'人造光让人们在日落后仍能出行和工作，但光线过强会影响野生动物和人的睡眠。明亮的建筑可能让迁徙的鸟类迷失方向，有些昆虫也会聚集在灯旁，而不是觅食。一些城镇通过调暗不必要的灯光、选用向下照射的灯具来应对。这些改变不大，却能让人们更容易看见夜空。',words:{artificial:'人造的',affect:'影响',wildlife:'野生动物',migrating:'迁徙的',confused:'困惑的',insects:'昆虫',responded:'作出回应',modest:'适度的',downwards:'向下地'}},
{id:'b2-1',level:'B2',topic:'时事',icon:'🌱',mins:5,title:'The Quiet Revolution in Urban Food',text:'Across many cities, rooftop farms and community plots are changing how residents think about food. Their contribution to total food supply remains small, and they cannot replace large farms. Yet these projects can shorten supply chains, make fresh produce more accessible and give residents a practical understanding of seasonal growing. Their broader value may lie less in volume than in resilience: communities learn to cooperate and respond to local needs.',translation:'在许多城市，屋顶农场和社区菜圃正在改变居民对食物的看法。它们对食物总供应的贡献仍然有限，也无法取代大型农场。不过，这些项目可以缩短供应链，让人们更容易获得新鲜农产品，并帮助居民切实了解季节性种植。它们更广泛的价值或许不在产量，而在韧性：社区学会合作并回应本地需求。',words:{contribution:'贡献',supply:'供应',accessible:'易获得的',seasonal:'季节性的',broader:'更广泛的',resilience:'韧性',cooperate:'合作',respond:'回应'}},
{id:'b2-2',level:'B2',topic:'科技',icon:'🤖',mins:5,title:'When Algorithms Shape the News',text:'News platforms increasingly use recommendation systems to decide which stories appear on a reader’s screen. These tools can help people find relevant material, but they may also narrow the range of viewpoints encountered. The challenge is not simply to remove personalisation; readers value convenience. Instead, designers and publishers can make recommendations more transparent and give users meaningful ways to explore beyond familiar topics.',translation:'新闻平台越来越多地使用推荐系统，决定哪些报道会出现在读者屏幕上。这些工具能帮助人们找到相关内容，但也可能缩窄读者接触到的观点范围。挑战并非简单地取消个性化，因为读者看重便利。设计者和出版商可以让推荐机制更加透明，并为用户提供有意义的方式，帮助他们探索熟悉主题之外的内容。',words:{increasingly:'日益；越来越',recommendation:'推荐',relevant:'相关的',narrow:'缩小',viewpoints:'观点',personalisation:'个性化',transparent:'透明的',meaningful:'有意义的'}},
{id:'b2-3',level:'B2',topic:'文学',icon:'🎭',mins:5,title:'The Many Lives of a Classic',text:'A classic novel does not remain fixed once its author has finished writing. Each generation brings different questions to the same pages, noticing details earlier readers may have overlooked. New translations and adaptations further reshape the work, sometimes revealing tensions that were less visible in the original context. Its endurance, then, may depend not on universal agreement but on its ability to invite renewed interpretation.',translation:'一部经典小说并不会在作者写完后就固定不变。每一代读者都会带着不同的问题重读同一篇章，注意到前人可能忽略的细节。新的译本和改编进一步重塑作品，有时会揭示原始语境中不那么显眼的张力。因此，经典的持久生命力或许不依赖普遍共识，而在于它能够引发新的解读。',words:{generation:'一代人',overlooked:'忽视的',adaptations:'改编作品',reshape:'重塑',tensions:'张力；矛盾',endurance:'持久力',universal:'普遍的',interpretation:'解读'}},
{id:'c1-1',level:'C1',topic:'科学',icon:'🧠',mins:6,title:'The Case for Intellectual Humility',text:'In an age of instant commentary, confidence is often mistaken for expertise. Yet the most reliable forms of knowledge tend to be provisional: they invite scrutiny, state their limits and remain open to revision. Intellectual humility is not a refusal to reach conclusions. It is the discipline of matching certainty to evidence, while recognising that a well-formed question can be more productive than a premature answer.',translation:'在即时评论盛行的时代，自信常被误认为专业能力。然而，最可靠的知识往往是暂定的：它们欢迎审视、说明自身局限，并对修正保持开放。谦逊求知并不意味着拒绝得出结论，而是让确定程度与证据相匹配，同时认识到，一个恰当的问题可能比仓促的答案更有价值。',words:{commentary:'评论',expertise:'专业能力',provisional:'暂定的',scrutiny:'审视',revision:'修正',discipline:'自律；训练',certainty:'确定性',premature:'仓促的'}},
{id:'c1-2',level:'C1',topic:'文化',icon:'🎨',mins:6,title:'Museums After the Age of Spectacle',text:'Museums once derived much of their authority from the apparent neutrality of display: objects were presented as though their meanings were self-evident. Contemporary institutions increasingly acknowledge that selection, acquisition and interpretation are shaped by power. This shift does not diminish the museum’s role; rather, it invites a more reciprocal relationship with communities whose histories have often been framed by others.',translation:'博物馆过去的权威很大程度上来自展陈表面上的中立性：展品仿佛具有不言自明的意义。当代机构越来越承认，藏品的选择、获取和阐释都受到权力关系的影响。这种转变并未削弱博物馆的作用；相反，它促成博物馆与相关社群建立更平等的关系，而这些社群的历史往往一直由他人来叙述。',words:{derived:'源自',neutrality:'中立性',apparent:'表面上的','self-evident':'不言自明的',acquisition:'获取；收购',interpretation:'阐释',reciprocal:'互惠的',framed:'被塑造；被叙述'}},
{id:'c1-3',level:'C1',topic:'时事',icon:'🏛️',mins:6,title:'The Infrastructure of Trust',text:'Public trust is frequently discussed as though it were a sentiment that institutions can restore through a well-crafted statement. In practice, trust accumulates through repeated encounters with competence, candour and fair procedures. When public bodies explain uncertainty rather than conceal it, they may appear less authoritative in the short term; over time, however, such honesty can make their decisions more credible and their errors easier to correct.',translation:'公共信任常被讨论得仿佛是一种情绪，只要机构发表措辞得当的声明就能恢复。实际上，信任是在一次次接触称职、坦诚和公平程序的过程中逐渐积累的。当公共机构选择解释而非掩盖不确定性时，短期内或许显得不够权威；但从长远看，这种诚实能让决策更可信，也让错误更容易被纠正。',words:{sentiment:'情绪；看法',institutions:'机构',accumulates:'积累',candour:'坦诚',procedures:'程序',conceal:'掩盖',authoritative:'权威的',credible:'可信的'}},
{id:'c2-1',level:'C2',topic:'文学',icon:'✒️',mins:7,title:'Translation and the Productive Imperfection',text:'The ideal of a definitive translation presupposes that a work possesses a stable essence waiting to be transferred intact between languages. Yet every act of translation is also an act of interpretation: rhythm, ambiguity and cultural resonance cannot simply be relocated. This does not render translation futile. On the contrary, the productive friction between versions exposes dimensions of the source that a monolingual reading might leave dormant.',translation:'“权威定本式译文”这一理想预设了一种稳定的作品本质，等待被完整地转移到另一种语言中。然而，每一次翻译同时也是一次阐释：节奏、歧义和文化共鸣无法被原封不动地迁移。这并不意味着翻译徒劳无益。恰恰相反，不同译本之间富有成效的摩擦，能揭示原作的某些维度，而单语阅读可能让这些维度沉睡不显。',words:{definitive:'权威定本式的',presupposes:'预设',essence:'本质',ambiguity:'歧义',resonance:'共鸣',futile:'徒劳的',friction:'摩擦',dormant:'潜在未显的'}},
{id:'c2-2',level:'C2',topic:'科学',icon:'🔬',mins:7,title:'What Models Leave Out',text:'A model earns its usefulness by excluding detail; its elegance often lies in the disciplined omission of features deemed irrelevant to a particular inquiry. Trouble begins when this methodological convenience is mistaken for an exhaustive account of reality. The most consequential assumptions are frequently those rendered invisible by successful simplification. A mature analysis therefore asks not only what a model predicts, but which absences make that prediction possible.',translation:'模型之所以有用，恰恰因为它排除了细节；它的优雅往往在于有纪律地省略对特定问题而言无关紧要的特征。当这种方法上的便利被误认为对现实的穷尽性描述，问题便由此开始。影响最大的假设，往往正是那些被成功简化过程隐藏起来的假设。因此，成熟的分析不仅要问模型预测了什么，还要追问：哪些缺失使这一预测成为可能？',words:{excludes:'排除',disciplined:'有纪律的',omission:'省略',inquiry:'探究',methodological:'方法上的',exhaustive:'穷尽的',consequential:'影响重大的',absences:'缺失'}},
{id:'c2-3',level:'C2',topic:'文化',icon:'🌐',mins:7,title:'Memory as a Public Practice',text:'Collective memory is less a repository of settled facts than an ongoing negotiation over what a society chooses to foreground, commemorate or consign to silence. Monuments, archives and anniversaries give this negotiation material form, although none can settle it conclusively. Their significance lies partly in making disagreement legible: a public culture capable of revisiting its inherited narratives may be more resilient than one that mistakes consensus for historical closure.',translation:'集体记忆与其说是既定事实的储藏库，不如说是社会持续协商的过程：哪些内容值得突出、纪念，哪些又被置于沉默之中。纪念碑、档案和纪念日让这种协商具有了具体形式，尽管它们都无法为其盖棺定论。它们的意义部分在于让分歧变得可见：能够重新审视继承而来的叙事的公共文化，或许比把共识误当作历史终结的文化更有韧性。',words:{repository:'储藏库',negotiation:'协商',foreground:'突出',commemorate:'纪念',consign:'置于',conclusively:'最终地',legible:'可理解的；可见的',inherited:'继承而来的',closure:'终结'}}
];
try{const savedWords=JSON.parse(localStorage.getItem('englishStepsWords')||'{}');articles.forEach(a=>Object.assign(a.words,savedWords[a.id]||{}))}catch{}
const levelInfo=Object.fromEntries(levels.map(l=>[l[0],l]));let currentLevel='A1',currentTopic='全部',currentId='a1-1',rate=0.85;const learned=new Set();
function listForLevel(){return articles.filter(a=>a.level===currentLevel&&(currentTopic==='全部'||a.topic===currentTopic)&&a.title.toLowerCase().includes(document.getElementById('search').value.trim().toLowerCase()))}
function renderLevels(){document.getElementById('levels').innerHTML=levels.map(([code,cn,en])=>`<button class="level ${code===currentLevel?'active':''}" data-level="${code}"><b>${code}</b><span>${cn} · ${en}</span></button>`).join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{currentLevel=b.dataset.level;currentTopic='全部';const first=articles.find(a=>a.level===currentLevel);currentId=first?.id;render()})}
function renderFilters(){let topics=['全部',...new Set(articles.filter(a=>a.level===currentLevel).map(a=>a.topic))];document.getElementById('filters').innerHTML=topics.map(t=>`<button class="chip ${t===currentTopic?'active':''}" data-topic="${t}">${t}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{currentTopic=b.dataset.topic;render()})}
function renderList(){let data=listForLevel();if(!data.some(a=>a.id===currentId))currentId=data[0]?.id;document.getElementById('articleList').innerHTML=data.length?data.map(a=>`<div class="article-row ${a.id===currentId?'selected':''}" data-id="${a.id}"><div class="article-icon">${a.icon}</div><div><div class="article-title">${a.title}${a.subtitle?` <span style="font:400 13px 'DM Sans',sans-serif;color:var(--muted)">· ${a.subtitle}</span>`:''}</div><div class="article-meta">${a.topic} <span>·</span> ${a.text.split(/\s+/).length} 词</div></div><div class="duration">${a.mins} 分钟 →</div></div>`).join(''):'<div class="empty">没有找到相关短文</div>';document.querySelectorAll('.article-row').forEach(row=>row.onclick=()=>{currentId=row.dataset.id;render()});document.getElementById('articleCount').textContent=`${articles.filter(a=>a.level===currentLevel).length} 篇短文`;document.getElementById('progressLabel').textContent=`${currentLevel} · ${levelInfo[currentLevel][1]}`}
function renderDetail(){let a=articles.find(x=>x.id===currentId);if(!a){document.getElementById('detail').innerHTML='';return}let html=a.text.split(/(\s+)/).map(s=>/^\s+$/.test(s)?s:`<span class="word ${learned.has(s.toLowerCase().replace(/[^a-z'-]/g,''))?'known':''}" data-word="${s.toLowerCase().replace(/[^a-z'-]/g,'')}">${s}</span>`).join('');document.getElementById('detail').innerHTML=`<div class="detail-top"><span class="tag">${a.level} · ${levelInfo[a.level][1]}　/　${a.topic}</span><div class="controls"><select class="speed" id="speed" aria-label="朗读速度"><option value="0.7">0.7×</option><option value="0.85" selected>0.85×</option><option value="1">1×</option><option value="1.15">1.15×</option></select><button class="play" id="play">▶ 播放朗读</button></div></div><h2>${a.title}${a.subtitle?` <span style="font:400 17px 'DM Sans',sans-serif;color:var(--muted)">· ${a.subtitle}</span>`:''}</h2><div class="detail-sub">${a.level} 分级短文 · 约 ${a.mins} 分钟</div><p class="prose">${html}</p><div class="translation"><b>中文参考</b><br>${a.translation}</div>`;document.getElementById('speed').onchange=e=>rate=Number(e.target.value);document.getElementById('play').onclick=()=>speak(a);document.querySelectorAll('.word').forEach(el=>el.onclick=()=>lookup(el.dataset.word,a))}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderWords(){let a=articles.find(x=>x.id===currentId);document.getElementById('wordlist').innerHTML=a?Object.entries(a.words).slice(-6).reverse().map(([w,m])=>`<div class="vocab"><b>${escapeHtml(w)}</b><span>${escapeHtml(m)}</span></div>`).join(''):''}
function render(){renderLevels();renderFilters();renderList();renderDetail();renderWords()}
function speak(a){if(!('speechSynthesis'in window)){toast('此浏览器暂不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(a.text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u);document.getElementById('play').textContent='⏸ 正在朗读';u.onend=()=>{let b=document.getElementById('play');if(b)b.textContent='▶ 播放朗读'};u.onerror=()=>{let b=document.getElementById('play');if(b)b.textContent='▶ 播放朗读'}}
async function lookup(word,a){let entries=Object.entries(a.words),entry=entries.find(([w])=>w.toLowerCase()===word)||entries.find(([w])=>w.toLowerCase().replace(/s$|ed$|ing$/,'')===word.replace(/s$|ed$|ing$/,''));if(entry){learned.add(word);toast(`${word}  ·  ${entry[1]}`);renderWords();return}if(a.words[word]){toast(`${word}  ·  ${a.words[word]}`);return}toast(`正在查询 “${word}”…`);try{const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh-CN`;const response=await fetch(url);if(!response.ok)throw new Error('lookup failed');const data=await response.json();const meaning=data?.responseData?.translatedText?.trim();if(!meaning||meaning.toLowerCase()===word.toLowerCase()||/QUERY LENGTH|PLEASE SELECT|NO QUERY/i.test(meaning))throw new Error('no translation');a.words[word]=meaning;try{const saved=JSON.parse(localStorage.getItem('englishStepsWords')||'{}');saved[a.id]={...(saved[a.id]||{}),[word]:meaning};localStorage.setItem('englishStepsWords',JSON.stringify(saved))}catch{}learned.add(word);toast(`${word}  ·  ${meaning}`);renderWords()}catch(error){toast(`“${word}”在线释义暂时不可用，请检查网络后重试`)}}
let toastTimer;function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
document.getElementById('search').oninput=renderList;render();
</script></body></html>
