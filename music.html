<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><meta name="description" content="English Steps 音乐跟读：原创分级英文歌曲，从 A1 到 C2 分级别，点击歌曲跳转独立播放页跟学。"><title>音乐跟读 · English Steps</title><link rel="stylesheet" href="site.css"><link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="English Steps"><link rel="apple-touch-icon" href="images/icons/icon-192.png">
<style>
  .music-shell{max-width:960px;margin:auto;padding:0 32px 60px}
  .music-header{padding:34px 0 14px}
  .music-header h1{font:500 clamp(34px,5vw,48px)/1.05 Newsreader;margin:12px 0 10px;letter-spacing:-1px}
  .music-header h1 em{color:var(--green);font-weight:400}
  .music-header p{color:var(--muted);font-size:12px;line-height:1.8;max-width:600px}
  .level-nav{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 30px}
  .level-nav a{text-decoration:none;border:1px solid var(--line);background:transparent;border-radius:22px;padding:9px 15px;font-size:12px;color:var(--muted);transition:.16s}
  .level-nav a:hover,.level-nav a:focus-visible{border-color:var(--green);color:var(--green);outline:none}
  .level-nav a b{font-size:13px}
  .music-level-sec{margin:0 0 34px}
  .sec-head{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:15px}
  .sec-head .lvl-badge{background:var(--green);color:#fff;border-radius:9px;padding:5px 11px;font-size:12px;font-weight:700;letter-spacing:.4px}
  .sec-head .lvl-name{font:500 21px Newsreader,serif}
  .sec-head .lvl-en{color:var(--muted);font-size:11px}
  .sec-head .lvl-count{margin-left:auto;color:var(--muted);font-size:11px}
  .song-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .song-card{position:relative;display:flex;flex-direction:column;gap:4px;text-decoration:none;border:1px solid var(--line);background:var(--white);border-radius:16px;padding:18px 19px;transition:transform .16s,box-shadow .16s,border-color .2s;color:var(--ink);box-shadow:0 5px 20px #233c2b06}
  .song-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d3dfd3}
  .song-card b{font:500 21px Newsreader,serif;padding-right:54px}
  .song-cn{font-size:12px;color:var(--muted);line-height:1.5}
  .song-theme{position:absolute;top:15px;right:16px;color:var(--green);background:var(--mint);border-radius:16px;padding:4px 9px;font-size:9px;font-weight:600}
  .song-style{font-size:10px;color:var(--muted);margin-top:5px}
  .song-meta{margin-top:auto;padding-top:15px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}
  .song-arrow{color:var(--green);font-size:17px}
  .song-card:focus-visible{outline:3px solid #27634c44;outline-offset:3px}
  @media(max-width:820px){.song-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:580px){.music-shell{padding:0 15px 40px}.music-header{padding:26px 0 10px}.music-header h1{font-size:37px}.song-grid{grid-template-columns:1fr;gap:10px}}
</style></head>
<body><div class="shell">
  <header class="topbar"><a class="brand" href="index.html"><span class="brandmark">e</span> English Steps</a><nav class="toplinks"><a href="index.html#library">阅读书架</a><a href="music.html" aria-current="page">音乐跟读</a><a href="index.html#about">学习指南</a></nav></header>
  <div class="music-shell">
    <div class="music-header">
      <a class="back-link" href="index.html">← 返回阅读书架</a>
      <div class="eyebrow">LISTEN · SING · LEARN</div>
      <h1>音乐跟读 <em>Music Room</em></h1>
      <p>原创分级英文歌曲，从 A1 到 C2 分级别。点击任意歌曲，在新页面打开独立播放器：完整演唱 + 歌词随进度高亮 + 中英对照 + 生词。全部为原创歌词 + AI 演唱。</p>
    </div>
    <nav class="level-nav" id="levelNav" aria-label="跳转到级别"></nav>
    <div id="levelSections" aria-label="分级歌曲列表"></div>
  </div>
  <footer class="footer"><span>English Steps · 音乐跟读</span><span>原创歌词 + AI 演唱，逐句学习用 · 共 <span id="totalCount"></span> 首</span></footer>
</div><script src="music-data.js"></script><script src="music.js"></script><script src="sw-register.js"></script></body></html>
